# The newsroom itself runs every minute on Cloudflare (worker/).
# This job keeps a copy of its news.json in the repo (the site's fallback)
# and rebuilds rss.xml from it, committing only when something changed.
name: Newsroom backup + RSS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy news from the Cloudflare newsroom
        run: |
          curl -sf --max-time 30 https://catnews-newsroom.itsizzydudee.workers.dev/news.json -o /tmp/news.json \
            && node -e 'const d=require("/tmp/news.json"); if(!d.items?.length) process.exit(1)' \
            && node -e 'const fs=require("fs"); const a=require("/tmp/news.json"); const b=fs.existsSync("news.json")?require("./news.json"):{}; if(JSON.stringify(a.items)!==JSON.stringify(b.items)) fs.writeFileSync("news.json", JSON.stringify(a))' \
            || node build-news.js
      - run: node build-rss.js
      - name: Commit if changed
        run: |
          git add news.json rss.xml
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git config user.name "catnews-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "newsroom: update $(date -u +%H:%M)"
            git push
          fi
