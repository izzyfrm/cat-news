<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CatNews! · Lost?</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07080f">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CatNews">
  <meta property="og:title" content="CatNews — lost in space">
  <meta property="og:description" content="This page doesn't exist. Meow..?">
  <meta property="og:image" content="https://catnews.space/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="CatNews: a shocked cat in a pink ring, next to the words AI news for developers">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CatNews — lost in space">
  <meta name="twitter:description" content="This page doesn't exist. Meow..?">
  <meta name="twitter:image" content="https://catnews.space/og-image.png">
  <link rel="icon" href="https://catnews.space/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://catnews.space/style.css">
  <style>
    body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 32px 16px; overflow: hidden; }
    .lost > * { animation: rise .7s var(--ease) both; }
    .lost > *:nth-child(2) { animation-delay: .1s; }
    .lost > *:nth-child(3) { animation-delay: .18s; }
    .lost > *:nth-child(4) { animation-delay: .26s; }
    .lost > *:nth-child(5) { animation-delay: .34s; }

    /* 4 [cat] 4 — the logo is the zero */
    .big { display: flex; align-items: center; justify-content: center; gap: clamp(6px, 2vw, 16px); margin-bottom: 20px; user-select: none; }
    .four { font: 700 clamp(96px, 22vw, 176px)/1 var(--sans); letter-spacing: -0.06em; color: var(--line-strong); }
    .zero { width: clamp(90px, 20vw, 156px); animation: tumble 10s ease-in-out infinite; }
    .zero img { width: 100%; height: auto; }
    /* drifting with no gravity */
    @keyframes tumble {
      0%, 100% { transform: translate(0, 0) rotate(-8deg); }
      30%      { transform: translate(5px, -12px) rotate(10deg); }
      60%      { transform: translate(-6px, -5px) rotate(22deg); }
    }

    .code { font: 500 13px var(--mono); color: var(--accent); margin: 0 0 10px; }
    h1 { font-size: clamp(28px, 6vw, 42px); letter-spacing: -0.03em; line-height: 1.1; margin: 0 0 12px; }
    .q { display: inline-block; color: var(--accent); animation: tilt 2s ease-in-out infinite; }
    @keyframes tilt { 50% { transform: rotate(14deg) translateY(-3px); } }
    .sub { color: var(--muted); max-width: 42ch; margin: 0 auto 26px; }
    .path { font: 13px var(--mono); background: var(--panel); border: 1px solid var(--line); padding: 2px 8px; border-radius: 6px; color: var(--text); word-break: break-all; }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .ring { width: 16px; height: 16px; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 2.5; }
    .ring .track { stroke: rgba(0, 0, 0, .15); }
    .ring .bar { stroke: var(--bg); stroke-linecap: round; stroke-dasharray: 50.27; animation: countdown 10s linear forwards; }
    @keyframes countdown { to { stroke-dashoffset: 50.27; } }
    .count { display: block; margin-top: 16px; font: 12px var(--mono); color: var(--faint); }
    .count button { font: inherit; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }
  </style>
</head>
<body>
  <canvas id="space" aria-hidden="true"></canvas>

  <main class="lost">
    <div class="big" aria-label="404">
      <span class="four">4</span>
      <div class="zero"><img src="https://catnews.space/logo-mark.svg" alt=""></div>
      <span class="four">4</span>
    </div>
    <p class="code">404 · /meow</p>
    <h1>Looks like you're lost!<br>Meow<span class="q">..?</span></h1>
    <p class="sub">The cat searched the whole galaxy and couldn't find <span class="path" id="path">this page</span>.</p>
    <div>
      <div class="actions">
        <a class="btn primary" href="https://catnews.space">
          <svg class="ring" viewBox="0 0 20 20" aria-hidden="true"><circle class="track" cx="10" cy="10" r="8"/><circle class="bar" cx="10" cy="10" r="8"/></svg>
          Back to the news
        </a>
        <a class="btn" href="https://catnews.space/our-speed/">Our speed</a>
        <a class="btn" href="https://info.catnews.space">What is CatNews?</a>
      </div>
      <span class="count" id="count"></span>
    </div>
  </main>

  <script>
    // show the route they tried, then make the address bar read /meow
    const tried = location.pathname;
    if (tried && tried !== "/meow") {
      document.getElementById("path").textContent = tried;
      history.replaceState(null, "", "/meow");
    }

    // head home after 10s, unless they'd rather stay
    let n = 10, timer;
    const count = document.getElementById("count");
    const tick = () => {
      count.innerHTML = `going home in ${n}s · <button type="button" id="stay">stay here</button>`;
      document.getElementById("stay").onclick = () => {
        clearTimeout(timer);
        count.textContent = "okay — floating here with the cat.";
        document.querySelector(".ring .bar").style.animationPlayState = "paused";
      };
      if (n-- === 0) location.href = "https://catnews.space";
      else timer = setTimeout(tick, 1000);
    };
    tick();
  </script>
  <script src="https://catnews.space/space.js"></script>
</body>
</html>
